name: Webshow checks
on:
  pull_request:
  push:
    branches:
      - feature/joyful-webshow-experience-20261021
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - name: Check module syntax
        run: |
          find public/js public/shared -name '*.js' -print0 | xargs -0 -n1 node --check
