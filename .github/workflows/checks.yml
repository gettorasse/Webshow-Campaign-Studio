name: Webshow checks
on:
  pull_request:
  push:
    branches:
      - feature/joyful-webshow-experience-20261021
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check module syntax
        run: |
          find public/js public/shared -name '*.js' -print0 | xargs -0 -n1 node --check
