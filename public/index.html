<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Webshow</title>
<meta name="description" content="Your Showrunner: an AI marketing buddy that plans your campaigns, writes every post and tells you what to do today.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script id="desktop-to-pro">
/* On a computer (wide screen, mouse, no touch), Webshow opens as Pro. Phones and tablets get the app.
   ?view=phone keeps the phone app on this computer (for testing); ?view=pro switches back. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get("view");
    if (q === "phone") localStorage.setItem("webshow.view", "phone");
    if (q === "pro") localStorage.removeItem("webshow.view");
    if (localStorage.getItem("webshow.view") === "phone") return;
  } catch (e) {}
  var ipad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  var desktop = matchMedia("(min-width: 1024px) and (hover: hover) and (pointer: fine)").matches && !ipad;
  if (desktop) location.replace("pro/");
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="desk" aria-label="About this view">
  <span class="wordmark">webshow<b>.ai</b></span>
  <p>You're looking at the phone app on a computer (test mode). On a computer, Webshow normally opens as Pro.</p>
  <a class="btn sm" href="./?view=pro">Back to Webshow Pro</a>
</aside>
<div class="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<div id="sheet"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript>Webshow needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
