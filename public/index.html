<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Webshow</title>
<meta name="description" content="Your Showrunner: an AI marketing buddy that plans your campaigns, writes every post and tells you what to do today.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script id="desktop-to-pro">
/* Which experience opens (mirrors experienceFor() in shared/bridge.js; tests check they agree):
   computer (wide screen, mouse, no touch) → Webshow Pro; phones and tablets → Webshow Play.
   ?view=play keeps Play on this device, ?view=pro switches back. No plan is needed in the demo. */
(function () {
  var stored = "", q = "";
  try { q = new URLSearchParams(location.search).get("view") || ""; if (q === "phone") q = "play"; stored = localStorage.getItem("webshow.view") || "";
    if (q === "play") localStorage.setItem("webshow.view", "play"); if (q === "pro") localStorage.removeItem("webshow.view"); } catch (e) {}
  var ipad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  var desktop = matchMedia("(min-width: 1024px) and (hover: hover) and (pointer: fine)").matches && !ipad;
  var choice = q === "play" || q === "pro" ? q : (stored === "play" || stored === "phone") ? "play" : desktop ? "pro" : "play";
  document.documentElement.dataset.desktop = desktop ? "yes" : "no";
  if (choice === "pro") location.replace("pro/" + (location.hash.indexOf("#/show/") === 0 ? "#show=" + location.hash.slice(7) : ""));
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="desk" aria-label="About this view">
  <span class="wordmark">webshow<b>.ai</b></span>
  <p><b>Webshow Play</b> is the guided experience, made for your phone. Same Shows, same Showrunner.</p>
  <p><b>Webshow Pro</b> is the full studio for your computer: every Show on a canvas, with its Showrunner beside it.</p>
  <a class="btn sm" href="./?view=pro">Open Webshow Pro</a>
</aside>
<div class="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Main"></nav>
  <div id="drawer"></div>
  <div id="stage"></div>
</div>
<div id="sheet"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript>Webshow needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
