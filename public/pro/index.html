<title>Webshow Campaign Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Pixelify+Sans:wght@400..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Fraunces:opsz,wght@9..144,400..800&family=Instrument+Sans:wght@400..700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400..700&family=Fredoka:wght@400..700&family=Nunito:wght@400..800&family=Inter+Tight:wght@400..800&family=Inter:wght@400..700&family=Syne:wght@500..800&family=DM+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: Enjoy's native three-pane grammar (sidebar → list → main → inspector), 13px UI, hairline rings,
   6/10 radii — dressed in webshow.fi: navy-black stage, periwinkle tint, orange for the one CTA,
   neon green for live, Funnel Display for every title and number. The canvas is the hero. */
:root{
  --canvas:#000000; --chrome:#0a0a0b; --panel:#0b0b0c; --raised:#1c1c1e; --bubble:#242427; --well:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --ink:#f5f5f7; --muted:#a1a1a8; --faint:#6b6b72;
  --tint:#6b7fff; --on-tint:#ffffff; --lav:#aeb5ff; --brand:#6b7fff; --icmix:0%; --c1:#6b7fff; --c2:#00917d; --c3:#b28324; --c4:#b0597e; --c5:#0086b3; --c6:#518b44; --c7:#8b66b3; --c8:#8a90a8;
  --cta:#fd4415; --on-cta:#ffffff; --live:#6b7fff; --on-live:#ffffff;
  --good:#8b9bff; --warn:#fd4415; --bad:#fd4415;
  --hover:rgba(255,255,255,.05); --select:rgba(138,152,255,.16);
  --ring:inset 0 0 0 .5px rgba(255,255,255,.14), 0 .5px 1.5px rgba(0,0,0,.6);
  --pop:0 0 0 .5px rgba(255,255,255,.14), 0 18px 48px rgba(0,0,0,.75);
  --dot:rgba(255,255,255,.10); --dots-off:rgba(255,255,255,.09); --dots-on:rgba(160,172,255,.55);
  --glow:radial-gradient(70% 60% at 50% -10%,rgba(93,79,255,.38) 0%,rgba(77,68,216,.18) 30%,rgba(28,29,76,.06) 60%,rgba(0,0,0,0) 85%);
  --pt-text:#a39cf4; --pt-image:#86b4e0; --pt-style:#a3c493; --pt-page:#6b7fff; --pt-overlay:#6b7fff; --pt-post:#d6bd85; --pt-link:#a39cf4; --pt-ad:#d6bd85;
  --f-pixel:"Funnel Display","Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-ui:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r1:6px; --r2:10px; --ctl:28px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --canvas:#ffffff; --chrome:#f4f5fa; --panel:#fafbfe; --raised:#ffffff; --bubble:#eef0f8; --well:rgba(10,11,27,.035);
  --line:#e3e5ee; --line-2:#cfd2e0; --ink:#0a0b1b; --muted:#5b5f78; --faint:#9a9eb5;
  --tint:#6b7fff; --on-tint:#ffffff; --lav:#5855ff; --brand:#6b7fff; --icmix:34%; --c1:#6b7fff; --c2:#00816c; --c3:#a56e00; --c4:#a4406d; --c5:#0075a9; --c6:#367b24; --c7:#7c50a8; --c8:#6f7590; --cta:#fd4415; --on-cta:#ffffff; --live:#6b7fff; --on-live:#ffffff;
  --good:#5866f0; --warn:#fd4415; --bad:#fd4415;
  --hover:rgba(10,11,27,.04); --select:rgba(88,85,255,.10);
  --ring:inset 0 0 0 .5px rgba(10,11,27,.16), 0 .5px 1.5px rgba(10,11,27,.08);
  --pop:0 0 0 .5px rgba(10,11,27,.14), 0 14px 40px rgba(10,11,27,.16);
  --dot:rgba(10,11,27,.10); --dots-off:rgba(10,11,27,.06); --dots-on:rgba(88,85,255,.38);
  --glow:radial-gradient(70% 60% at 50% -10%,rgba(107,127,255,.16) 0%,rgba(174,181,255,.08) 40%,rgba(255,255,255,0) 80%);
  --pt-text:#7a71d9; --pt-image:#5b8fc0; --pt-style:#6f9660; --pt-page:#6b7fff; --pt-overlay:#6b7fff; --pt-post:#a3864a; --pt-link:#7a71d9; --pt-ad:#a3864a;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --canvas:#ffffff; --chrome:#f4f5fa; --panel:#fafbfe; --raised:#ffffff; --bubble:#eef0f8; --well:rgba(10,11,27,.035);
  --line:#e3e5ee; --line-2:#cfd2e0; --ink:#0a0b1b; --muted:#5b5f78; --faint:#9a9eb5;
  --tint:#6b7fff; --on-tint:#ffffff; --lav:#5855ff; --brand:#6b7fff; --icmix:34%; --c1:#6b7fff; --c2:#00816c; --c3:#a56e00; --c4:#a4406d; --c5:#0075a9; --c6:#367b24; --c7:#7c50a8; --c8:#6f7590; --cta:#fd4415; --on-cta:#ffffff; --live:#6b7fff; --on-live:#ffffff;
  --good:#5866f0; --warn:#fd4415; --bad:#fd4415;
  --hover:rgba(10,11,27,.04); --select:rgba(88,85,255,.10);
  --ring:inset 0 0 0 .5px rgba(10,11,27,.16), 0 .5px 1.5px rgba(10,11,27,.08);
  --pop:0 0 0 .5px rgba(10,11,27,.14), 0 14px 40px rgba(10,11,27,.16);
  --dot:rgba(10,11,27,.10); --dots-off:rgba(10,11,27,.06); --dots-on:rgba(88,85,255,.38);
  --glow:radial-gradient(70% 60% at 50% -10%,rgba(107,127,255,.16) 0%,rgba(174,181,255,.08) 40%,rgba(255,255,255,0) 80%);
  --pt-text:#7a71d9; --pt-image:#5b8fc0; --pt-style:#6f9660; --pt-page:#6b7fff; --pt-overlay:#6b7fff; --pt-post:#a3864a; --pt-link:#7a71d9; --pt-ad:#a3864a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:13px/1.45 var(--f-ui);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--chrome)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid color-mix(in srgb,var(--tint) 70%,transparent);outline-offset:1px}
h1,h2,h3,h4,p{margin:0}
.px{font-family:var(--f-pixel);font-weight:500;letter-spacing:-.02em;font-synthesis:none}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:14px;height:14px}

/* ---------- app frame ---------- */
#app{height:100%}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%;padding-left:env(safe-area-inset-left,0px)}
.app.sb-hidden{grid-template-columns:0 minmax(0,1fr)}
.sb{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px}
.wordmark{font:400 22px/1 "Pixelify Sans",var(--f-pixel);letter-spacing:-.02em;font-synthesis:none}
.wordmark i{font-style:normal;color:var(--lav)}
.sb-scroll{flex:1;overflow:auto;padding:0 8px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:1px;align-content:start}
.sb-search{display:flex;align-items:center;gap:6px;height:28px;margin:0 0 8px;padding:0 8px;border-radius:var(--r1);background:var(--well);color:var(--faint);box-shadow:inset 0 0 0 .5px var(--line)}
.sb-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:13px}
.srow{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r1);color:var(--ink);text-align:left;width:100%;min-width:0}
.srow:hover{background:var(--hover)}
.srow[aria-current="true"]{background:var(--select)}
.srow .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .ct{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.srow .ic{color:var(--ink);display:grid;place-items:center}
.srow.brand .ic{color:var(--brand)}
.sb-show .srow .ic,.sb-show .srow.sub .ic{color:color-mix(in srgb,var(--st),var(--ink) var(--icmix))}
.sb-show .srow.sub.needs .ic{color:var(--cta)}
.sb .badge{background:var(--cta);color:var(--on-cta)}
.srow.sub{padding-left:28px}
.srow.sub .ic{color:var(--ink)}
.badge{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--tint);color:var(--on-tint);font-size:10.5px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.sb-sep{height:10px}
.sb-head{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;font-weight:600;border-radius:var(--r1)}
.av{--nc:var(--brand);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:600 11px/1 var(--f-ui);flex:none;background:color-mix(in srgb,var(--nc) 22%,transparent);color:color-mix(in srgb,var(--nc),var(--ink) var(--icmix));box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--nc) 45%,transparent)}
.av.lg{width:52px;height:52px;border-radius:12px;font-size:22px}
.sb-foot{border-top:1px solid var(--line);padding:8px;display:grid;gap:1px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sb-foot .me{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px}
.uav{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;position:relative;flex:none;background-size:cover;background-position:center}
.uav .on{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--chrome)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-bottom:1px solid var(--line);flex:none;padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--canvas)}
.bar .title{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.bar .title>*{flex:none}
.bar .title>.muted{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar .title b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--tint) 20%,transparent);color:color-mix(in srgb,var(--tint) 55%,var(--ink));white-space:nowrap}
.tag-btn{gap:5px;cursor:text}
.tag-btn .icon{opacity:.55}
.tag-btn:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 60%,transparent)}
.tag-btn:hover .icon{opacity:1}
.inp.tag-in{flex:none;width:min(320px,50vw);min-height:24px;height:24px;padding:2px 8px;font-weight:600}
.peers{display:flex;align-items:center}
.peers .uav{width:24px;height:24px;box-shadow:0 0 0 2px var(--canvas);margin-left:-6px}
.peers .uav:first-child{margin-left:0}
.body{flex:1;min-height:0;display:flex;position:relative}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctl);padding:0 12px;border-radius:var(--r1);background:var(--raised);box-shadow:var(--ring);font-weight:500;white-space:nowrap;transition:background .12s,box-shadow .12s,filter .12s}
.btn:hover{background:color-mix(in srgb,var(--ink) 5%,var(--raised))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--tint);color:var(--on-tint);box-shadow:none}
.btn.primary:hover{filter:brightness(1.08)}
.btn.cta{background:var(--brand);color:var(--on-tint);box-shadow:none;border-radius:999px;padding:0 16px;font-family:var(--f-pixel);font-weight:400;letter-spacing:-.02em}
.btn.cta:hover{filter:brightness(1.07)}
.btn.live{background:var(--live);color:var(--on-live);box-shadow:none}
.btn.ghost{background:none;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:var(--r1);color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib[aria-pressed="true"]{background:var(--select);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--well);color:var(--muted);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-building{color:var(--tint);background:color-mix(in srgb,var(--tint) 16%,transparent)} .st-building i{animation:pulse 1s infinite}
.st-ready{color:var(--muted);background:var(--well);box-shadow:inset 0 0 0 .5px var(--line-2)}
.st-approved{color:var(--good);background:color-mix(in srgb,var(--brand) 16%,transparent)}
.st-failed{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.st-live{color:var(--on-live);background:var(--brand)}
.st-needs{color:var(--cta);background:color-mix(in srgb,var(--cta) 14%,transparent)}
.st-stale{color:var(--warn);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 50%,transparent)}
@keyframes pulse{50%{opacity:.25}}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--well);box-shadow:inset 0 0 0 .5px var(--line);gap:1px}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--ring)}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.fld>small{font-size:11.5px;color:var(--faint)}
.inp,.ta,.sel{width:100%;min-height:var(--ctl);padding:5px 9px;border-radius:var(--r1);background:var(--raised);border:0;box-shadow:var(--ring);color:var(--ink);font-size:13px;outline:0}
.ta{min-height:72px;resize:vertical;line-height:1.45}
.inp:focus,.ta:focus,.sel:focus{box-shadow:inset 0 0 0 1px var(--tint),0 0 0 3px color-mix(in srgb,var(--tint) 22%,transparent)}
.inp.warn{box-shadow:inset 0 0 0 1px var(--bad)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
input[type=range]{width:100%;accent-color:var(--tint)}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:24px}
.empty h3{color:var(--ink);font:400 22px/1.15 var(--f-pixel);letter-spacing:-.03em}

/* ---------- home ---------- */
.home{flex:1;overflow:auto;background:var(--glow) no-repeat,var(--canvas);background-size:100% 520px}
.home-in{max-width:760px;margin:0 auto;padding:56px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));display:grid;gap:28px}
.hello{display:flex;align-items:center;gap:14px}
.hello h1{font:400 clamp(28px,4vw,40px)/1 var(--f-pixel);letter-spacing:-.04em}
.sr-mark{width:40px;height:40px;border-radius:10px;background:var(--raised);box-shadow:var(--ring);display:grid;place-items:center;flex:none}
.composer{background:var(--raised);border-radius:var(--r2);box-shadow:var(--ring),0 10px 30px -18px rgba(0,0,0,.5);display:grid}
.composer textarea{border:0;outline:0;background:none;resize:none;padding:12px 14px 4px;min-height:52px;font-size:14px;color:var(--ink)}
.composer .cbar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--on-tint)}
.send[disabled]{background:var(--well);color:var(--faint)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px}
@media (max-width:760px){.hgrid{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:6px}
.sec-h .n{color:var(--faint);font-weight:500;margin-left:6px}
.li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r1);width:100%;text-align:left}
.li:hover{background:var(--hover)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .go{color:var(--muted);font-size:12px;white-space:nowrap}
.showgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.showcard{background:var(--raised);box-shadow:var(--ring);border-radius:var(--r2);padding:12px;display:grid;gap:8px;text-align:left}
.showcard:hover{box-shadow:inset 0 0 0 1px var(--tint)}
.showcard .h{display:flex;gap:8px;align-items:center}
.showcard b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.showcard .mini{height:54px;border-radius:6px;background:var(--well);position:relative;overflow:hidden}
.sugg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.sugg{grid-template-columns:1fr}}
.sugg button{text-align:left;padding:12px;border-radius:var(--r2);box-shadow:inset 0 0 0 .5px var(--line);display:grid;gap:4px;color:var(--muted);background:color-mix(in srgb,var(--raised) 60%,transparent)}
.sugg button b{color:var(--ink);font-weight:600}
.sugg button:hover{box-shadow:inset 0 0 0 1px var(--tint)}

/* ---------- threads ---------- */
.list{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.list-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 12px}
.list-h h2{font:400 17px/1 var(--f-pixel);letter-spacing:-.03em}
.list-s{padding:0 10px 8px}
.list-b{flex:1;overflow:auto;padding:0 8px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start}
.tc{background:var(--raised);box-shadow:var(--ring);border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:5px;text-align:left;width:100%;min-width:0}
.needs-strip{min-width:0}.needs-strip .grow{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.needs-strip b,.needs-strip>span:last-child{flex:none;white-space:nowrap}
.tc:hover{box-shadow:inset 0 0 0 .5px var(--line-2),0 1px 3px rgba(0,0,0,.2)}
.tc .r1{display:flex;gap:6px;align-items:center}
.tc p{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .meta{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:11.5px}
.tc[aria-current="true"]{background:var(--tint);box-shadow:none;color:var(--on-tint)}
.tc[aria-current="true"] p,.tc[aria-current="true"] .meta{color:color-mix(in srgb,var(--on-tint) 78%,transparent)}
.tc[aria-current="true"] .tag{background:rgba(255,255,255,.2);color:var(--on-tint)}
.needs-strip{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--cta) 12%,transparent);color:var(--ink);padding:6px 8px;border-radius:6px;font-size:12px}
.tc[aria-current="true"] .needs-strip{background:rgba(255,255,255,.16);color:var(--on-tint)}
.needs-strip b{color:var(--cta);font-weight:600}
.tc[aria-current="true"] .needs-strip b{color:var(--on-tint)}
.needs-strip .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:grid;gap:10px;align-content:start}

/* ---------- canvas ---------- */
.cv{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;touch-action:none;min-width:0}
/* Osmo Supply: Interactive Dots Grid (Background) */
.interactive-dots-grid {
  pointer-events: none;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}
.home-dots{position:relative;overflow:hidden;flex:1;display:flex;min-width:0}
.home-dots .interactive-dots-grid{font-size:16px}
.home-dots>.home{position:absolute;inset:0;background:var(--glow) no-repeat;background-size:100% 520px}
.cv.hand,.cv.panning{cursor:grab} .cv.panning{cursor:grabbing}
.cv.commenting{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke-width:2;pointer-events:stroke;cursor:pointer}
.wires path.hit{stroke:transparent;stroke-width:14}
.wires path.sel{stroke-width:3.5}
.wires path.flow{stroke-dasharray:6 6;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.nd{position:absolute;width:248px;background:var(--raised);border-radius:var(--r2);box-shadow:var(--ring),0 12px 30px -16px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}

.nd .peer-ring{position:absolute;inset:-4px;border-radius:13px;pointer-events:none;box-shadow:0 0 0 1.5px var(--pc)}
.nd .peer-ring b{position:absolute;top:-18px;right:6px;font-size:10.5px;font-weight:600;color:#fff;background:var(--pc);padding:1px 6px;border-radius:4px;white-space:nowrap}
.nh{display:flex;align-items:center;gap:7px;padding:9px 10px 0 10px;cursor:grab}
.nico{--nc:var(--brand);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--nc) 18%,transparent);color:color-mix(in srgb,var(--nc),var(--ink) var(--icmix));box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--nc) 38%,transparent)}
.nh .ty{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt{padding:5px 10px 8px;font:400 15px/1.2 var(--f-pixel);letter-spacing:-.02em;overflow-wrap:anywhere}
.nb{margin:0 8px;border-radius:7px;overflow:hidden;background:var(--well);min-height:20px;position:relative}
.nports{display:grid;gap:2px;padding:8px 0 10px}
.prow{position:relative;display:flex;align-items:center;height:20px;padding:0 12px;font-size:11.5px;color:var(--muted)}

.port{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--raised);box-shadow:inset 0 0 0 2.5px var(--pc);cursor:crosshair;z-index:2}

.cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:30;transition:transform .08s linear}

/* node body previews */

/* inspector */

@media (max-width:760px){.insp{position:fixed;inset:auto 0 0 0;height:72vh;width:100%;z-index:60;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--pop)}}

/* sleek, barely-there scrollbars */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 9%,transparent) transparent}
*:hover{scrollbar-color:color-mix(in srgb,var(--ink) 22%,transparent) transparent}

/* blocks: thin border in the block's colour; outputs: dim when idle, softly glowing when active */
.nd.blk::after,.nd.out::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 75%,transparent)}
.nd.out.off{opacity:.5;transition:opacity .2s}
.nd.out.off:hover,.nd.out.off[aria-selected="true"]{opacity:.85}
.nd.out.on{opacity:1;animation:outglow 2.4s ease-in-out infinite}
@keyframes outglow{0%,100%{box-shadow:var(--ring),0 0 0 0 color-mix(in srgb,var(--nc) 0%,transparent),0 12px 30px -16px rgba(0,0,0,.55)}50%{box-shadow:var(--ring),0 0 14px 2px color-mix(in srgb,var(--nc) 45%,transparent),0 12px 30px -16px rgba(0,0,0,.55)}}
.nd.out.on[aria-selected="true"]{animation:none}

/* lanes on the canvas */

function extractPalette(n) {

}

/* ============================================================
   Osmo Supply: Interactive Dots Grid (Background), unmodified
   ============================================================ */
function initInteractiveDotsGridBackground() {
  const elements = document.querySelectorAll('[data-dots-canvas-init]');
  if (!elements.length) return;

  const gap = '1em';
  const dotSize = '0.125em';
  const shape = 'circle'; // 'circle' or 'square'
  const dotColorInactive = 'rgba(0, 0, 0, 0.2)';
  const dotColorActive = 'rgba(0, 0, 0, 0.75)';
  const dotMaxScale = 1.375;
  const pressScale = 1.5;
  const hoverRadius = 6;
  const easeDuration = 0.5;

  const hasPointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const pointer = { x: 0, y: 0, cx: 0, cy: 0, active: false };
  const hover = { value: 0, from: 0, to: 0, start: 0 };
  const press = { value: 0, from: 0, to: 0, start: 0 };
  const canvases = [];

  let dpr, size, spacing, radius, raf, lastTime = performance.now();

  function toPx(value, element) {
    const probe = document.createElement('div');
    probe.style.cssText = `position:absolute;visibility:hidden;width:${value};`;
    element.appendChild(probe);
    const px = probe.getBoundingClientRect().width;
    probe.remove();
    return px;
  }

  function parseColor(color, element) {
    const probe = document.createElement('span');
    probe.style.color = color;
    element.appendChild(probe);
    const resolved = getComputedStyle(probe).color;
    probe.remove();

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = resolved;
    ctx.fillRect(0, 0, 1, 1);

    const data = [...ctx.getImageData(0, 0, 1, 1).data];
    data[3] /= 255;
    return data;
  }

  function mixColor(a, b, p) {
    return `rgba(${a.map((v, i) => v + (b[i] - v) * p).join(',')})`;
  }

  function setEase(state, to) {
    Object.assign(state, { from: state.value, to, start: performance.now() });
  }

  function updateEase(state, time) {
    if (!easeDuration) return state.value = state.to;
    const p = Math.min(Math.max((time - state.start) / (easeDuration * 1000), 0), 1);
    state.value = state.from + (state.to - state.from) * (1 - Math.pow(1 - p, 4));
  }

  elements.forEach((element) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.setAttribute('aria-hidden', 'true');
    Object.assign(canvas.style, { position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' });

    if (getComputedStyle(element).position === 'static') element.style.position = 'relative';

    element.prepend(canvas);
    canvases.push({
      element, canvas, ctx, width: 0, height: 0, visible: false,
      inactive: parseColor(element.getAttribute('data-dots-color-inactive') || dotColorInactive, element),
      active: parseColor(element.getAttribute('data-dots-color-active') || dotColorActive, element)
    });
  });

  function pointerInside() {
    return canvases.some(({ element }) => {
      const r = element.getBoundingClientRect();
      return pointer.x >= r.left && pointer.x <= r.right && pointer.y >= r.top && pointer.y <= r.bottom;
    });
  }

  function render(state, origin) {
    const rect = state.element.getBoundingClientRect();
    const left = rect.left - origin.left;
    const top = rect.top - origin.top;
    const px = pointer.cx - origin.left;
    const py = pointer.cy - origin.top;
    const maxScale = dotMaxScale * (1 + (pressScale - 1) * press.value);

    state.ctx.clearRect(0, 0, state.width, state.height);

    const colStart = Math.floor(left / spacing);
    const colEnd = Math.ceil((left + state.width) / spacing);
    const rowStart = Math.floor(top / spacing);
    const rowEnd = Math.ceil((top + state.height) / spacing);

    for (let row = rowStart; row <= rowEnd; row++) {
      const gy = row * spacing;
      const y = gy - top;

      for (let col = colStart; col <= colEnd; col++) {
        const gx = col * spacing;
        const x = gx - left;
        const influence = hasPointer && hover.value ? Math.max(0, 1 - Math.hypot(gx - px, gy - py) / radius) * hover.value : 0;
        const currentSize = size * (1 + (maxScale - 1) * influence);

        state.ctx.fillStyle = mixColor(state.inactive, state.active, influence);

        if (shape === 'square') {
          state.ctx.fillRect(x - currentSize / 2, y - currentSize / 2, currentSize, currentSize);
        } else {
          state.ctx.beginPath();
          state.ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
          state.ctx.fill();
        }
      }
    }
  }

  function renderAll(visibleOnly = false) {
    const origin = elements[0].getBoundingClientRect();
    canvases.forEach(state => (!visibleOnly || state.visible) && render(state, origin));
  }

  function tick(time) {
    raf = null;
    if (!canvases.some(state => state.visible)) return;

    const delta = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    updateEase(hover, time);
    updateEase(press, time);

    if (!easeDuration) {
      pointer.cx = pointer.x;
      pointer.cy = pointer.y;
    } else {
      const strength = 1 - Math.exp(-delta * 6 / easeDuration);
      pointer.cx += (pointer.x - pointer.cx) * strength;
      pointer.cy += (pointer.y - pointer.cy) * strength;
    }

    renderAll(true);
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (hasPointer && !raf && canvases.some(state => state.visible)) {
      lastTime = performance.now();
      raf = requestAnimationFrame(tick);
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    size = toPx(dotSize, elements[0]);
    spacing = size + toPx(gap, elements[0]);
    radius = spacing * hoverRadius;

    canvases.forEach(state => {
      const rect = state.element.getBoundingClientRect();
      state.width = rect.width;
      state.height = rect.height;
      state.canvas.width = Math.round(rect.width * dpr);
      state.canvas.height = Math.round(rect.height * dpr);
      state.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });

    renderAll();
    start();
  }

  if (hasPointer) {
    window.addEventListener('pointermove', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;

      const inside = pointerInside();

      if (inside !== pointer.active) {
        pointer.active = inside;
        setEase(hover, +inside);

        if (inside) {
          pointer.cx = pointer.x;
          pointer.cy = pointer.y;
        } else {
          setEase(press, 0);
        }
      }

      start();
    });

    window.addEventListener('pointerdown', () => pointer.active && setEase(press, 1));
    window.addEventListener('pointerup', () => setEase(press, 0));
  }

  const intersectionObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const state = canvases.find(state => state.element === entry.target);
      if (state) state.visible = entry.isIntersecting;
    });

    hasPointer ? start() : renderAll(true);
  });

  const resizeObserver = new ResizeObserver(resize);

  elements.forEach(element => {
    intersectionObserver.observe(element);
    resizeObserver.observe(element);
  });

  window.addEventListener('resize', resize);
  resize();
}

function briefOffline(t) {

  const first = t.split(/[.,:;–—\n]/)[0].trim(); const facts = t.split(/(?<=[.!?])\s+/).filter(x => /\d/.test(x)).join(" ");

A.brieffill = async (b) => {

  let r = null; const t0 = Date.now();

  await minWait(t0);
  if (!r || !r.offer) r = briefOffline(t);
  const p = n.p; ["business", "offer", "audience", "cta", "facts"].forEach(k => { const v = str(r[k]); if (v) p[k] = v.slice(0, 400); }); if (GOAL_OPTS.some(x => x[0] === r.goal)) p.goal = r.goal;
  S.briefBusy = false; hist(n, AI.fn ? "Brief filled by Showrunner" : "Brief filled from a prompt"); commitNode(n); paintNode(n.id); G.edgesFrom(n.id).forEach(e => paintNode(e.to)); S.inspFor = null; paintInspector(); if (S.nodeEd) neRepaint(); toast("Brief filled. Check it, then build your blocks.");

["publish", "adchannel", "chatbot"].forEach(k => { const f = NT[k].params; NT[k].params = () => ({ start: "", end: "", ...f() }); });
{ const f = NT.scheduler.params; NT.scheduler.params = () => ({ from: "", until: "", ...f() }); }
/* date-window keys: the scheduler's start/end are opening hours, so its window uses from/until */
const DK = (n) => n.type === "scheduler" ? ["from", "until"] : ["start", "end"];
const winP = (n) => { const [a, b] = DK(n); return { start: n.p[a] || "", end: n.p[b] || "" }; };
const STAGES = [["reach", "Reach", "Ads and social posts bring people in"], ["engage", "Engage", "Your page and chatbot answer and persuade"], ["convert", "Convert", "Popups and bookings turn visitors into leads"]];
const TL_STAGE = { adchannel: "reach", carousel: "reach", ad: "reach", metaad: "reach", publish: "engage", chatbot: "engage", popup: "convert", scheduler: "convert" };
const TL_ZOOM = { "2w": [14, 56], "6w": [42, 24], "q": [91, 11] };
S.tl = { zoom: "6w", start: null, sel: null };
const DAY = 864e5;
const isoOf = (d) => new Date(d * DAY).toISOString().slice(0, 10);
const dayIx = (iso) => iso ? Math.floor(Date.parse(iso + "T00:00:00Z") / DAY) : null;
const todayIx = () => localDayOf(Date.now());
const fmtDay = (d, o = { day: "numeric", month: "short" }) => new Date(d * DAY).toLocaleDateString("en-GB", { ...o, timeZone: "UTC" });

/* ---------- rows ---------- */
function pageLive() { const pub = Object.values(S.nodes).find(n => n.type === "publish"); if (!pub) return null; return winOf(pub); }
function winOf(n) {
  const p = n.p; const wp = winP(n); const t = todayIx(); let s = dayIx(wp.start), e = dayIx(wp.end), follows = false;
  if (n.type === "publish" && s == null && p.live) s = localDayOf(p.at || Date.now());
  if (n.type === "adchannel" && s == null && p.launched) s = localDayOf(p.launched);
  if (s == null && ["popup", "chatbot", "scheduler"].includes(n.type)) { const pg = G.edgesFrom(n.id).map(x => S.nodes[x.to]).find(x => x?.type === "page"); const pub = pg && Object.values(S.nodes).find(x => x.type === "publish" && G.up(x.id, "page")[0]?.id === pg.id); const w = pub && winOf(pub); if (w?.s != null) { s = w.s; e = e ?? w.e; follows = true; } }
  if (s == null) return { s: null, e: null, state: "draft", follows };
  let state = s > t ? "scheduled" : e != null && e < t ? "ended" : "live";
  if (n.type === "publish" && state === "live" && !p.live) state = "due";
  if (n.type === "adchannel" && !p.launched && state === "live") state = "due";
  return { s, e, state, follows };
}
function leadsFor(n, slugs) {
  const L = (S.live?.leads || []).filter(l => slugs.has(l.slug));
  if (n.type === "popup") return L.filter(l => (l.message || "") === "Popup: " + n.p.headline || (l.message || "").startsWith("Popup: " + (n.p.headline || "").slice(0, 20)));
  if (n.type === "chatbot") return L.filter(l => (l.message || "").startsWith("Chatbot:"));
  if (n.type === "scheduler") return L.filter(l => (l.message || "").startsWith("Booking:"));
  if (n.type === "publish") return L.filter(l => !/^(Popup|Chatbot|Booking):/.test(l.message || ""));
  return [];
}
function tlRows(r0, r1) {
  const pubs = Object.values(S.nodes).filter(n => n.type === "publish"); const slugs = new Set(pubs.map(p => p.p.slug).filter(Boolean));
  const days = Array.from({ length: r1 - r0 + 1 }, (_, i) => r0 + i);
  const rows = Object.values(S.nodes).filter(n => TL_STAGE[n.type] && !(["ad", "metaad"].includes(n.type) && Object.values(S.nodes).some(x => x.type === "adchannel" && G.up(x.id, "ads").some(u => u.id === n.id)))).map(n => {
    const r = { n, stage: TL_STAGE[n.type], win: ["carousel", "ad", "metaad"].includes(n.type) ? null : winOf(n), marks: [], metric: null };
    if (n.type === "carousel") r.marks = (n.p.posts || []).map(p => ({ id: p.id, d: localDayOf(p.at), at: p.at, done: p.at <= Date.now(), accounts: p.accounts || [] }));
    if (["publish", "popup", "chatbot", "scheduler"].includes(n.type)) { const ls = leadsFor(n, slugs); const series = days.map(d => ls.filter(l => localDayOf(l.at) === d).length);
      const visits = n.type === "publish" ? [...slugs].reduce((a, s) => a + (S.live?.visits?.[s] || 0), 0) : null;
      r.metric = { kind: "leads", value: series.reduce((a, b) => a + b, 0), label: n.type === "scheduler" ? "Bookings" : "Leads", series, real: true, sub: visits != null ? `${num(visits)} visits` : "" }; }
    if (n.type === "adchannel") { const pl = (n.p.platforms || []).filter(conOn); const series = days.map(d => d > todayIx() ? 0 : pl.reduce((a, k) => a + sampleDay(S.showId, k, d).clicks, 0)); r.metric = pl.length ? { kind: "reach", value: series.reduce((a, b) => a + b, 0), label: "Ad clicks", series, real: false } : null; }
    if (n.type === "carousel") { const posts = (n.p.posts || []).filter(p => p.at <= Date.now()); const series = days.map(d => d > todayIx() ? 0 : Math.round(posts.reduce((a, p) => { const age = d - localDayOf(p.at); return a + (age >= 0 && age < 5 ? (300 + hash(p.id) % 2400) / (age + 1) / 2.3 : 0); }, 0)));
      r.metric = posts.length ? { kind: "reach", value: series.reduce((a, b) => a + b, 0), label: "Reach", series, real: false } : null; }
    return r;
  });
  const best = (kind) => rows.filter(r => r.metric?.kind === kind && r.metric.value > 0).sort((a, b) => b.metric.value - a.metric.value)[0];
  const b1 = best("leads"), b2 = best("reach"); if (b1) b1.top = "Best converter"; if (b2) b2.top = "Best reach";
  return rows;
}

function repaintTL() { if (S.view !== "timeline") return; const b = $("#body"); const h0 = b.querySelector(".home"); const sc = h0?.scrollTop, sx = $("#tlwrap")?.scrollLeft; b.innerHTML = timelineView(); const h = b.querySelector(".home"); if (h && sc) h.scrollTop = sc; const w = $("#tlwrap"); if (w && sx != null) w.scrollLeft = sx; }
function setDates(n, s, e, note) { const [a, b] = DK(n); n.p[a] = s == null ? "" : isoOf(s); n.p[b] = e == null ? "" : isoOf(e); hist(n, note); commitNode(n); paintNode(n.id); runSchedules(); }

        ${o.chAuto ? `<p class="ob-hint">Picked for you: ${o.recommended.map(k => OB_CH.find(c => c[0] === k)[1]).join(", ")}. A landing page is always included.</p>` : `<p class="ob-hint">A landing page is always included: every post and ad sends people there.</p>`}

        <p class="ob-hint"><b>${SHOWRUNNERS[o.showrunner].name}:</b> ${esc(SHOWRUNNERS[o.showrunner].line)} Each Showrunner follows the published marketing principles of the person it's named after; not affiliated with them.</p></div>

}

/* ---------- understanding the first message ---------- */
function obGuessGoal(t) { t = t.toLowerCase(); return /book|varaa|varaus|reserv|appointment|class|kurssi|sauna|hotel|table/.test(t) ? "bookings" : /shop|store|kauppa|product|tuote|buy|osta|sale/.test(t) ? "sell" : /event|tapahtuma|concert|festival|seminar|webinar/.test(t) ? "event" : /launch|new |uusi|lanseer|subscription|tilaus/.test(t) ? "launch" : /aware|tunnettuus|brand/.test(t) ? "awareness" : "leads"; }
function obParseOffline(t) {
  const g = obGuessGoal(t); const m = t.match(/(\d+)\s*(viikk|week)/i); const n = t.match(/\b(\d{2,4})\s*(new )?(members|leads|bookings|customers|asiakas|varau|jäsen)/i);
  const said = OB_CH.filter(([k]) => new RegExp({ instagram: "instagram|insta", facebook: "facebook", linkedinpage: "linkedin", tiktokacc: "tiktok", meta: "meta ads|facebook ads|mainos", gads: "google" }[k], "i").test(t)).map(c => c[0]);
  return { what: t, business: "", audience: "", audOptions: [], goal: "", goalGuess: g, target: n ? +n[1] : 0, offer: "", weeks: m ? Math.max(2, Math.min(8, +m[1])) : 0, channels: said, recommended: OB_REC[g], format: OB_FMT[g], ai: false };
}
async function obUnderstand(text) {
  const off = obParseOffline(text); if (!AI.fn) return off;
  try {
    const r = await AI.json(`You are Showrunner in Webshow Campaign Studio, reading a business owner's first message about a campaign. Pull out ONLY what they actually said, and recommend the rest.\n${RULES}\n<input>${text}</input>\nReply with ONLY JSON: {"what": "what they promote, one or two sentences in their language", "business": "business name if said, else empty", "audience": "the audience ONLY if they said it, else empty", "audience_options": ["3 short, likely audiences, in their language"], "goal": one of ${GOAL_OPTS.map(g => `"${g[0]}"`).join("|")} ONLY if clear, else "", "goal_guess": your best guess from the same list, "target": the number they want ONLY if said, else 0, "offer": "the offer ONLY if said, else empty", "weeks": duration in weeks if said, else 0, "format": one of ${Object.keys(SHOW_FORMATS).map(k => `"${k}"`).join("|")}, "channels_said": [channel keys they named, from ${OB_CH.map(c => `"${c[0]}"`).join(", ")}], "channels_recommended": [2-4 keys from the same list that fit this business best]}`, { modelTier: "quick" });
    const okc = (k) => OB_CH.some(c => c[0] === k); const okg = (g) => GOAL_OPTS.some(x => x[0] === g);
    return { what: str(r?.what) || text, business: str(r?.business), audience: str(r?.audience), audOptions: arr(r?.audience_options, 3).map(x => clip(str(x), 80)).filter(Boolean), goal: okg(r?.goal) ? r.goal : "", goalGuess: okg(r?.goal_guess) ? r.goal_guess : off.goalGuess, target: Math.max(0, Math.round(+r?.target || 0)), offer: str(r?.offer), weeks: Math.max(0, Math.min(8, Math.round(+r?.weeks || 0))), channels: arr(r?.channels_said, 6).filter(okc), recommended: arr(r?.channels_recommended, 4).filter(okc).length ? arr(r?.channels_recommended, 4).filter(okc) : off.recommended, format: SHOW_FORMATS[r?.format] ? r.format : off.format, ai: true };
  } catch { return off; }
}
async function obStart(text) {
  S.ob = { ...obBlank(), what: text, showrunner: S.ob?.showrunner || "ogilvy" }; S.view = "onboard"; S.showId = null; render();
  const t0 = Date.now(); const p = await obUnderstand(text); await minWait(t0, 1400); const o = S.ob; if (S.view !== "onboard" || !o) return;
  Object.assign(o, { what: p.what, business: p.business, audOptions: p.audOptions, goalGuess: p.goalGuess, recommended: p.recommended, format: p.format, ai: p.ai, parsed: true });
  if (p.audience) o.audience = p.audience; if (p.goal) o.goal = p.goal; if (p.target) o.target = p.target; if (p.offer) o.offer = p.offer; if (p.weeks) o.weeks = p.weeks;
  o.channels = p.channels.length ? p.channels : [...p.recommended]; o.chAuto = !p.channels.length;
  o.known = { what: p.ai, audience: !!p.audience, goal: !!p.goal, offer: !!p.offer, weeks: !!p.weeks, channels: !!p.channels.length };
  rerenderBody();
}

/* ---------- generate: DNA in the Showrunner's voice → season plan → build on the canvas ---------- */
const OB_STEPS = ["Writing the Show DNA", "Planning the season", "Building it on the canvas"];
function obGenModal() { if (S.obStep == null) return ""; return `<div class="scrim top"><div class="modal ob-gen" role="status" aria-live="polite"><div class="ob-stage" aria-hidden="true"><i>Hook</i><i>Show</i><i>Convert</i></div><h3>Creating your show</h3><p class="muted">${esc(SHOWRUNNERS[S.obName || "ogilvy"]?.name || "")} is running it.</p><ol class="ob-steps">${OB_STEPS.map((t, i) => `<li class="${i < S.obStep ? "ok" : i === S.obStep ? "on" : ""}"><span class="b">${i < S.obStep ? ICON.check : ""}</span>${t}</li>`).join("")}</ol></div></div>`; }
{ const _cl = conLayer; conLayer = () => _cl() + obGenModal(); }
async function obGenerate() {
  const o = S.ob; if (!o || str(o.what).length < 6) return toast("Tell your Showrunner what you're promoting first.");
  const goal = o.goal || o.goalGuess; const target = +o.target || OB_TARGET[goal] || 30; const budget = Math.max(0, +o.budget || 0);
  S.obSR = o.showrunner; S.obName = o.showrunner; S.obStep = 0; paintLayer();
  let r = null;
  if (AI.fn) { try { r = await AI.json(`You are Showrunner in Webshow Campaign Studio. Write the DNA of ONE campaign show: one goal, one big idea.\n${RULES}\n<input>What: ${o.what}\nBusiness: ${o.business || "(not given)"}\nAudience: ${o.audience || "(decide)"}\nGoal: ${goal}, target ${target}\nOffer: ${o.offer || "(not given)"}\nRuns ${o.weeks} weeks from ${o.start}. Budget €${budget}.</input>\nReply with ONLY JSON: {"name": "show name, max 4 words", "tint": one of ${Object.keys(TINTS).filter(k => k !== "slate").map(k => `"${k}"`).join("|")}, "idea": "the big idea in one short sentence", "business": "business name", "offer": "the offer, only as stated", "audience": "who, one sentence", "cta": "main action, 2-4 words", "facts": "facts from the input only, or empty"}`); } catch (e) { toast(errCopy(e)); } }
  const s = createShow({ name: str(r?.name) || clip(o.business || o.what.split(/[.,:\n]/)[0], 32) || "New show", tint: TINTS[r?.tint] ? r.tint : undefined });
  s.showrunner = o.showrunner; s.onboard = { channels: o.channels, assets: o.assets, look: o.look, at: now() };
  s.dna = { ...DNA_DEF(), goal, target, idea: str(r?.idea), business: str(r?.business) || o.business || s.name, offer: str(r?.offer) || o.offer, audience: str(r?.audience) || o.audience, cta: str(r?.cta), facts: str(r?.facts), start: o.start, end: addDays(o.start, o.weeks * 7 - 1), budget: budget || "" };
  Store.putShow(s); S.obSR = null; S.obStep = 1; S.seasonFmt = o.format || OB_FMT[goal] || "launch"; S.ob = null;
  openShow(s.id, "plan"); paintLayer();
  await planSeason();
  if (!S.season) { S.obStep = null; paintLayer(); return toast("The season couldn't be planned. Check the DNA in Plan and try again."); }
  const ch = s.onboard.channels; const keep = (e) => (e.type !== "metaad" || (ch.includes("meta") && budget)) && (e.type !== "ad" || (ch.includes("gads") && budget)) && (!s.onboard.assets.length || ["metaad", "ad"].includes(e.type) || s.onboard.assets.includes(e.type));
  const eps = S.season.eps.filter(keep); if (eps.length >= 2) S.season.eps = eps;
  S.season.eps.forEach(e => { const can = EP_CHANNELS.filter(c => c[2].includes(e.type)).map(c => c[0]); const pick = ch.filter(k => can.includes(k) && (e.type === "metaad" || !["meta", "gads"].includes(k))); if (pick.length) e.channels = pick; });
  if (s.onboard.look) S.season.look = s.onboard.look;
  S.obStep = 2; paintLayer();
  const done = buildSeason();
  setTimeout(() => { S.obStep = null; paintLayer(); toast(`${SHOWRUNNERS[s.showrunner].name} is building your show. Everything on the canvas is yours to change.`, 5000); }, 700);
  await done;
}

/* ---------- the Showrunner stays visible in Plan, and can be switched ---------- */

  return `<section class="dcard"><div class="dcard-h"><b>Showrunner</b><span class="muted" style="font-size:12px">Steers every idea, hook and rewrite</span></div><div class="ob-srs sm">${SR_KEYS.map(x => `<button class="ob-sr" role="radio" aria-checked="${k === x}" data-act="srset" data-k="${x}"><span class="ob-sri">${ICON[SHOWRUNNERS[x].icon]}</span><b>${SHOWRUNNERS[x].name}</b></button>`).join("")}</div><span class="muted" style="font-size:12px">${esc(SHOWRUNNERS[k].line)}</span></section>`; }

document.addEventListener("input", (e) => { const t = e.target; const k = t.dataset?.ob; if (!k || !S.ob) return; S.ob[k] = k === "target" ? Math.max(0, +t.value || 0) : t.value; if (t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + 4 + "px"; } });
const obRe = () => { const sc = $(".ob-page"); const y = sc?.scrollTop || 0; rerenderBody(); const n = $(".ob-page"); if (n) n.scrollTop = y; };
Object.assign(A, {

  obex(b) { S.homeText = OB_EXAMPLES[+b.dataset.i][1]; const t = $("#homeask"); if (t) { t.value = S.homeText; t.focus(); } },

});
